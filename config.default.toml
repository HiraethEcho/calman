# ============================================================================
# calman — DEFAULT CONFIGURATION (config.default.toml)
#
# This file is the COMPLETE default configuration. It mirrors `Config::default()`
# exactly: if no `~/.config/calman/config.toml` exists, calman behaves as if this
# file were loaded. Copy it as your `config.toml` to start from known defaults,
# then override only the keys you need.
#
# Everything below is optional — omit any section to accept its default.
# ============================================================================

# ------------------------------------------------------------------- [defaults]
[defaults]
# Default source that `add` writes to.
write_source = "work"
# Report run by bare `calman` (unset → "next").
# default_report = "next"
# Upcoming occurrences to show per recurring series (recur-expand).
# 1 = nearest only (default); 0 = all future in the 1-year window.
recur_expand_count = 1

# ------------------------------------------------------------------- [contexts]
# Per-context source lists. Empty = all sources.
[contexts]
cli = []
sync = []
tui = []

# ----------------------------------------------------------------------- [date]
[date]
# Day start for named boundaries (`sod`/`sow`/`som`/…).
day_start = "00:00:00"
# Day end for named boundaries (`eod`/`eow`/`eom`/…).
day_end = "23:59:59"
# Fallback event length when neither `to:` nor `for:` is given.
# Empty (default) ⇒ instant event (DTSTART only, no DTEND).
default_event_duration = ""
# IANA timezone used when serialising timed `DTSTART`/`DTEND`/`DUE` to ICS with a
# `TZID` (iOS-style local wall time). Omitted → auto-detected from `$TZ` /
# `/etc/localtime`, else `UTC`.
# timezone = "Asia/Shanghai"

# ------------------------------------------------------------------------- [tui]
# Phase-3 TUI settings (reserved; not yet wired).
[tui]
# Vim-style keybindings (j/k/gg/G) when true, arrow keys when false.
vim_keys = false
# TUI default view filter: "todo" | "event" | "all".
default_filter = ""

# ---------------------------------------------------------------------- [icons]
# Per-kind nerdfont overrides. Omit to use builtin defaults:
#   todo:   pending=○  in-progress=●  recurring=⟳  completed=✓  cancelled=✕
#   event:  pending=󰃭 (calendar)  in-progress=●  recurring=󰃭  completed=✓  cancelled=✕
[icons]
[icons.todo]
pending = "○"
in-progress = "●"
recurring = "⟳"
completed = "✓"
cancelled = "✕"
# overdue 行: STATUS 列显示此键 (默认 "!"); date 列改为显示纯日期
overdue = "!"
[icons.event]
pending = "󰃭"
in-progress = "●"
recurring = "󰃭"
completed = "✓"
cancelled = "✕"

# ----------------------------------------------------------------- [colorscheme]
# Report row colors (Phase-3 TUI / `list --color`). Optional; omit for none.
# `priority` = rule precedence (first match wins). Built-in named colors:
#   black red green yellow blue magenta cyan white
#   gray0..gray23 (or grey)  bright-* variants
# Hex (#RRGGBB) and names from `palette` are also accepted for fg/bg.
[colorscheme]
priority = ["completed", "cancelled", "overdue", "today", "due",
            "priority.H", "priority.M", "priority.L",
            "scheduled", "tagged",
            "blocked", "blocking"]
# [colorscheme.palette]
# blue = "#1e90ff"
[colorscheme.rules]
completed = {fg="gray10"}
overdue = {inverse=true}
today = {fg="yellow", bold=true}
due = {fg="yellow"}
cancelled = {fg="gray10"}
blocked = {fg="gray10"}
blocking = {fg="gray10"}
scheduled = {fg="gray10"}
tagged = {fg="gray10"}
"priority.H" = {fg="red", bold=true}
"priority.M" = {fg="yellow"}
"priority.L" = {fg="blue"}

# ------------------------------------------------------------------- [report.*]
# Built-in reports (ls/list/next). Override here to change columns/filter/sort.
[report.ls]
filter = "type:todo status:active -status:recurring -WAITING or type:event due.after:sod -status:recurring -WAITING"
sort = ["due+", "created+"]
columns = [
  { field = "id", label = "ID", width = 4 },
  { field = "status", label = "ST", icon = true },
  { field = "date", label = "DATE", todo_format = "relative" },
  { field = "summary", label = "SUMMARY" },
]

[report.list]
filter = "type:todo -status:completed -status:cancelled -status:recurring -WAITING or type:event due.after:sod -status:recurring -WAITING"
sort = ["status-", "pri-", "due+"]
columns = [
  { field = "id", label = "ID", width = 4 },
  { field = "status", label = "STATUS", icon = true },
  { field = "pri", label = "PRI" },
  { field = "date", label = "DATE", todo_format = "relative" },
  { field = "tags", label = "TAGS" },
  { field = "recur", label = "RECUR" },
  { field = "summary", label = "SUMMARY" },
  { field = "desc", label = "DESC", format = "truncate", width = 40 },
]

[report.next]
filter = "type:todo status:active -status:recurring -WAITING or type:event due.after:sod -status:recurring -WAITING"
# Recurring series parents are hidden by default; show with `+PARENT` / `status:recurring`.
sort = ["due+", "pri-"]
columns = [
  { field = "id", label = "ID", width = 4 },
  { field = "status", label = "ST", icon = true },
  { field = "date", label = "DATE", todo_format = "relative" },
  { field = "summary", label = "SUMMARY" },
]

# ---------------------------------------------------------------------- [source]
# Default data source created when none is configured.
[[source]]
name = "work"
type = "jsonl"
location = "~/.local/share/calman/work/"
