[package]
name = "calman"
version = "0.1.0"
edition = "2024"
description = "Minimalist, keyboard-driven task manager with CLI and TUI"
license = "GPL-3.0-or-later"


[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = { version = "0.10.4", optional = true }
clap = { version = "4.6.6", features = ["derive"] }
crossterm = { version = "0.29", optional = true }
interim = { version = "0.2.1", optional = true, features = ["chrono_0_4"] }
ratatui = { version = "0.30", optional = true }
rrule = { version = "0.14.0", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
text2rrule = { version = "0.1.2", optional = true }
thiserror = "2.0.20"
toml = "1.1.4"
toml_edit = "0.25.13"
unicode-width = "0.2.1"
uuid = { version = "1.25.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"

[features]
default = ["storage-jsonl", "storage-ics", "date-ical", "date-natural", "recur-expand"]
storage-jsonl = []
storage-ics = ["dep:chrono-tz"]
date-ical = []                                      # baseline: T-compact format + raw RRULE passthrough
# date-ical is required (always on); date-natural adds NL parsing on top.
date-natural = ["date-ical", "dep:interim", "dep:text2rrule"]
tui = ["dep:ratatui", "dep:crossterm"]
recur-expand = ["date-ical", "dep:rrule", "dep:chrono-tz"]            # optional: expand RRULE into occurrences
