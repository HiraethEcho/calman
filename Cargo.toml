[package]
name = "calman"
version = "0.1.0"
edition = "2024"
description = "Minimalist, keyboard-driven task manager with CLI and TUI"
license = "GPL-3.0-or-later"


[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = { version = "0.29", optional = true }
ratatui = { version = "0.30", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
toml = "1.1.4"
toml_edit = "0.25.13"
uuid = { version = "1.25.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"

[features]
default = ["storage-jsonl", "storage-ics"]
storage-jsonl = []
storage-ics = []
tui = ["dep:ratatui", "dep:crossterm"]
